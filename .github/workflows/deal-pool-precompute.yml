name: PLAY deal pool precompute

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Nombre de donnes READY visé"
        required: false
        default: "240"
      batch:
        description: "Donnes calculées au maximum pendant ce run"
        required: false
        default: "240"

permissions:
  contents: read

concurrency:
  group: play-deal-pool-precompute
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build fully precomputed deals
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          BRIDGE_DEAL_POOL_TARGET: ${{ github.event.inputs.target || '240' }}
          BRIDGE_DEAL_POOL_BUILD_BATCH: ${{ github.event.inputs.batch || '240' }}
          BRIDGE_DEAL_POOL_BUILD_CONCURRENCY: "2"
        run: node scripts/fill-deal-pool.js
