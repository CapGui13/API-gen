name: PLAY deal pool precompute

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Nombre de donnes READY visé"
        required: false
        default: "240"
      batch:
        description: "Donnes calculées au maximum pendant ce run"
        required: false
        default: "40"
  schedule:
    # Passage toutes les 10 minutes. Un seul job peut tourner à la fois grâce au
    # groupe concurrency ci-dessous. Une fois le stock à 240, le run s'arrête
    # presque immédiatement après le LLEN Upstash et ne fait plus de DDS.
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: read

concurrency:
  group: play-deal-pool-precompute
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build fully precomputed deals
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          BRIDGE_DEAL_POOL_TARGET: ${{ github.event.inputs.target || '240' }}
          BRIDGE_DEAL_POOL_BUILD_BATCH: ${{ github.event.inputs.batch || '40' }}
        run: node scripts/fill-deal-pool.js
